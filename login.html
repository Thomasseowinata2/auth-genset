<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · Data Center Monitor</title>
  <script src="session.js"></script>
  <script>
    // ?need=<kategori> sengaja meminta kredensial yang belum ada, jadi jangan
    // dilempar balik ke portal walaupun kredensial lain sudah tersimpan.
    if (!new URLSearchParams(location.search).has("need") && hasAnyCredentials()) {
      location.replace("index.html" + location.hash);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

  <main class="login-card">
    <div class="brand">
      <div class="brand-title">Data Center Monitor</div>
      <div class="brand-site">Site JKT-01</div>
    </div>

    <!-- method="post" so credentials never land in the URL if JS fails to load -->
    <form class="login-body" id="loginForm" method="post">
      <h1 class="login-title">Masuk</h1>
      <p class="login-description" id="loginDescription"></p>

      <p class="login-error" id="loginError" hidden>Browser memblokir penyimpanan sesi, jadi kredensial tidak bisa disimpan. Cek pengaturan privasi browser.</p>

      <!-- Grup field per jenis perangkat diisi oleh login.js dari CATEGORIES. -->
      <div id="loginFields"></div>

      <button class="button-primary" type="submit">Masuk</button>
    </form>
  </main>

  <p class="login-note">Kredensial hanya disimpan di tab browser ini, tidak dikirim ke server portal. Klik Keluar di sidebar untuk menghapus semuanya.</p>

  <script src="devices.js"></script>
  <script src="login.js"></script>
</body>
</html>
