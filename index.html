<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Center Monitor</title>
  <script src="session.js"></script>
  <script>
    if (!loadCredentials()) location.replace("login.html" + location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">Data Center Monitor</div>
      <div class="brand-site">Site JKT-01</div>
    </div>

    <div class="nav-label">Ringkasan</div>
    <nav class="nav" id="overviewNav"></nav>

    <div class="nav-label">Kategori</div>
    <nav class="nav" id="nav"></nav>

    <div class="sync">
      <div>
        <div class="sync-label">Terakhir sinkron</div>
        <div class="sync-time" id="syncTime">—</div>
      </div>
      <button type="button" class="logout" id="logoutButton">Keluar</button>
    </div>
  </aside>

  <main class="content">
    <header class="content-header">
      <a class="crumb" id="crumb" hidden></a>
      <h1 id="categoryTitle"></h1>
      <span class="chip" id="contentBadge" hidden></span>
      <span class="content-count" id="categoryCount"></span>
      <div class="content-actions" id="dashboardActions" hidden>
        <span class="tag-dummy" title="Angka di dashboard masih data contoh, belum ditarik dari perangkat">Data dummy</span>
        <span class="updated" id="updatedAt"></span>
        <button type="button" class="refresh" id="refreshButton">Perbarui</button>
      </div>
    </header>
    <div class="grid" id="deviceGrid" hidden></div>
    <div class="dashboard" id="dashboard" hidden></div>
    <div class="dashboard" id="deviceDetail" hidden></div>
  </main>

  <form id="gensetLoginForm" method="POST" target="_blank" hidden>
    <input type="hidden" id="gensetUsername">
    <input type="hidden" id="gensetPassword">
  </form>

  <script src="devices.js"></script>
  <script src="metrics.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
